<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Quest · Equipment map</title>

<style>
/* Layout: full-height app; nautical map on the left, explanation panel on the right (below on phones) */
:root{
  --bg:#e9f0f2; --panel:#ffffff; --ink:#14232b; --muted:#536872; --line:#d0dce1; --chip:#eef4f6;
  --ocean:#cfe5ef; --lagoon:#e4f2f8; --land:#efe5cf; --land-edge:#bfa978; --reef:#2b9fc2;
  --track:#d99a00; --accent:#0b6e8a; --accent-ink:#ffffff; --hub:#6b3fa0; --cam:#1f7a45;
  --radio:#b4236b; --fibre:#1d5fd6; --sat:#0b6e8a; --infra:#8a979d; --sel:#e8513a; --on-c:#fff; --drone:#0e7fa3;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1317; --panel:#111c21; --ink:#e1eaed; --muted:#93a7b0; --line:#25363e; --chip:#18272e;
  --ocean:#0e2833; --lagoon:#133746; --land:#373022; --land-edge:#7a6844; --reef:#4cc3e3;
  --track:#f2c14b; --accent:#5ec3df; --accent-ink:#06171d; --hub:#c9a6f2; --cam:#6fd39a;
  --radio:#f27fb6; --fibre:#86acff; --sat:#5ec3df; --infra:#8b989e; --sel:#ff8a6b; --drone:#7fd3ec; --on-c:#06171d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1317; --panel:#111c21; --ink:#e1eaed; --muted:#93a7b0; --line:#25363e; --chip:#18272e;
  --ocean:#0e2833; --lagoon:#133746; --land:#373022; --land-edge:#7a6844; --reef:#4cc3e3;
  --track:#f2c14b; --accent:#5ec3df; --accent-ink:#06171d; --hub:#c9a6f2; --cam:#6fd39a;
  --radio:#f27fb6; --fibre:#86acff; --sat:#5ec3df; --infra:#8b989e; --sel:#ff8a6b; --drone:#7fd3ec; --on-c:#06171d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px}
.brand{display:grid;gap:2px;min-width:0;margin-right:auto}
.eb{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-stretch:82%;font-weight:800;font-size:1.6rem;line-height:1.05}
.vsel{display:inline-flex;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:4px}
.vsel button{display:grid;gap:1px;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:7px;padding:6px 16px;cursor:pointer;color:var(--muted);font:inherit}
.vsel button b{font-family:var(--f-display);font-stretch:88%;font-size:1.1rem;font-weight:800;line-height:1.1}
.vsel button span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.02em}
.vsel button:hover{color:var(--ink)}
.vsel button[data-v="lc"][aria-pressed="true"]{background:var(--radio);color:var(--on-c)}
.vsel button[data-v="pr"][aria-pressed="true"]{background:var(--fibre);color:var(--on-c)}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:5px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:.86rem}
table.cmp th,table.cmp td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp th{font-family:var(--f-display);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.cmp td.on{background:var(--chip);font-weight:600}
.switches{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;align-items:center;gap:2px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg span{font-size:.75rem;color:var(--muted);padding:0 6px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px}
.stage{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ocean)}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.1rem;font-weight:700;box-shadow:0 1px 3px #0002}
.status{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:center;padding:6px 10px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.scalebar{display:flex;align-items:center;gap:6px;font-family:var(--f-mono)}
.scalebar i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
.inspector{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0}
.ins-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:grid;gap:6px;z-index:1}
.ins-h h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:1.3rem;line-height:1.15}
.ins-b{padding:14px 16px 20px;display:grid;gap:16px}
.ins-b h3{margin:0 0 6px;font-family:var(--f-display);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ins-b p{margin:0}
.back{justify-self:start;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:.88rem}
.tag{justify-self:start;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:4px;border:1px solid currentColor}
.ver{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--chip);display:grid;gap:4px;font-size:.93rem}
.ver b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.legend{display:grid;gap:7px;font-size:.92rem}
.legend div{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.legend svg{width:44px;height:18px}
.list{display:grid;gap:2px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:7px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--chip)}
.row .d{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.dot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--cam);display:grid;place-items:center;font-size:.65rem;font-weight:700;font-family:var(--f-mono)}
.note{font-size:.84rem;color:var(--muted)}
.mk{cursor:pointer}
.mk .halo{fill:var(--panel);stroke-width:2.4}
.mk:hover .halo,.mk:focus-visible .halo{stroke-width:3.6}
.mk.sel .halo{stroke:var(--sel)!important;stroke-width:3.8}
.mk:focus{outline:none}
.lnk{cursor:pointer}
.drone{cursor:pointer}.drone:focus{outline:none}
.fly{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:.88rem;box-shadow:0 1px 3px #0002;color:var(--ink)}
.fly[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tele{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.tele div{border:1px solid var(--line);border-radius:7px;padding:6px 9px}.tele b{display:block;font-family:var(--f-mono);font-size:1.02rem;font-variant-numeric:tabular-nums}.tele span{font-size:.74rem;color:var(--muted)}
.lnk.hl line.vis{filter:drop-shadow(0 0 3px var(--sel))}
@media (max-width:900px){
  body{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .stage{height:64vh;min-height:380px}
  .inspector{overflow:visible}
}
</style>
</head>

<header>

<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const $=s=>document.querySelector(s);
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const fmt=n=>Math.round(n).toLocaleString("en-GB");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S={lk:"radio",vr:"lc",sel:null};
try{const a=localStorage.getItem("dq-lk"),b=localStorage.getItem("dq-vr");if(a==="radio"||a==="fibre")S.lk=a;if(b==="lc"||b==="pr")S.vr=b;}catch(e){}

const C=GEO.circuit, CUM=GEO.cum, L=GEO.L, HUB=GEO.hub, AIR=GEO.air;
const IDS=["C1-01","C1-02","C1-03","C1-04","C1-05","C1-06","C1-07","C1-08"];
const CAMS=IDS.map((id,i)=>({n:i+1,...GEO.cams[id]}));
const CPS=[0,209,614,1372,1670,1959,2387,2996];
const WHERE=["the start and finish line","the first bend after the start","the long straight on the south-west side","the hairpin at the south end","the south-east side","the east corner","the return straight on the north-east side","the last bend before the finish"];
function at(s){s=((s%L)+L)%L;let i=0;while(i<CUM.length-1&&CUM[i+1]<=s)i++;const a=C[i],b=C[(i+1)%C.length],sl=(i+1<CUM.length?CUM[i+1]:L)-CUM[i],t=sl?(s-CUM[i])/sl:0;return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,hd:Math.atan2(b[1]-a[1],b[0]-a[0])};}
const pr=()=>S.vr==="pr", radio=()=>!pr();
const total=CAMS.reduce((s,c)=>s+c.dHub,0);

/* ---------- texts ---------- */
const CPN=c=>{const l=[...CAMS].sort((a,b)=>a.lap%3227-b.lap%3227);return "CP"+(l.indexOf(c)+1);};
const kv=r=>`<dl class="kv">${r.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
const on=b=>b?' class="on"':'';
const T={
 overview(){return {
  title:"How the system works",
  body:`<p>${pr()?"<b>Premium</b>: the 8 cameras send their video through <b>armoured optical fibre</b>":"<b>Low-Cost</b>: the 8 cameras send their video <b>by radio</b> (5 GHz)"} to the <b>technical hub</b>. There the control room mixes cameras, the pilots’ goggle views and the commentary into <b>one programme</b>, which leaves the island by <b>VSAT satellite</b>, together with the drone and heart-rate data for the graphics.</p>
  <div><h3>Low-Cost vs Premium</h3><table class="cmp"><tr><th></th><th>Low-Cost</th><th>Premium</th></tr>
   <tr><td>Video</td><td${on(!pr())}>1080p · 30 fps</td><td${on(pr())}>1080p · 60 fps</td></tr>
   <tr><td>Cameras → hub</td><td${on(!pr())}>Radio, 5 GHz</td><td${on(pr())}>Optical fibre</td></tr>
   <tr><td>Graphics</td><td${on(!pr())}>2D</td><td${on(pr())}>AR/3D, 2D fallback</td></tr>
   <tr><td>Position, speed, height</td><td${on(!pr())}>1 per second</td><td${on(pr())}>5 per second</td></tr>
   <tr><td>Battery, heart rate</td><td${on(!pr())}>1 per second</td><td${on(pr())}>1 per second</td></tr>
   <tr><td>Satellite upload (VSAT)</td><td${on(!pr())}>10 Mbps</td><td${on(pr())}>15 Mbps</td></tr></table></div>`};},
 cam(c){return {
  title:"Camera C1-0"+c.n, tag:"Ground camera · "+CPN(c),
  body:`<p>Films ${WHERE[c.n-1]}. All 8 cameras transmit at the same time.</p>`+kv([
   ["Video",pr()?"Full HD 1080p · 60 fps":"Full HD 1080p · 30 fps"],
   ["Stream (estimate)",pr()?"~9.95 Mbps":"~4.98 Mbps"],
   ["Sends to the hub",pr()?"optical fibre, ~"+fmt(c.dHub*1.15)+" m of cable":"radio, "+fmt(c.dHub)+" m in a straight line"],
   ["Arrives at","the video mixer in the control room"],
   ["Distance to hub",fmt(c.dHub)+" m"],
   ["Following the drones",pr()?"broadcast camera with zoom":"automatic tracking"]])};},
 link(c){return !pr()?{
  title:"Radio link C1-0"+c.n+" → hub", tag:"Low-Cost · radio",
  body:kv([
   ["Distance",fmt(c.dHub)+" m (straight line)"],
   ["Band","5 GHz, one channel per camera"],
   ["Kept apart from","the drones’ radio controllers (2.4 GHz)"],
   ["Receiver","one per camera in the hub, then HDMI to the mixer"],
   ["Needs","a clear line of sight between camera and hub"],
   ["Advantage","quick to set up, no cables on the ground"]])+`<p class="note">To check: the range of the chosen radio kit must cover ${fmt(c.dHub)} m.</p>`}
  :{title:"Fibre cable C1-0"+c.n+" → hub", tag:"Premium · optical fibre",
  body:kv([
   ["Cable length","~"+fmt(c.dHub*1.15)+" m ("+fmt(c.dHub)+" m + 15% for bends)"],
   ["Cable","armoured single-mode fibre, laid on the ground"],
   ["Converters","video → light at the camera, light → video in the hub"],
   ["Arrives at","the video mixer in the control room (SDI)"],
   ["Interference","none: the signal is light, not radio"],
   ["Advantage","maximum stability, no dropouts"]])+`<p class="note">8 cables in total ≈ 5.1 km, protected where people cross them.</p>`};},
 hub(){return {
  title:"Technical hub", tag:"Centre of the island",
  body:`<p>All 8 cameras are less than 750 m away.</p>`+kv([
   ["Cameras",pr()?"8 fibre cables arrive here":"8 radio receivers"],
   ["Control room","video mixer: 8 cameras + pilots’ goggles → one programme"],
   ["Commentary","2 microphones, mixed into one audio track"],
   ["Pilot area","24 pilots, 8 flying per round, goggles → mixer"],
   ["Race data","2 Black Boxes: drone telemetry + heart rate (5 BLE hubs)"],
   ["Recording","the final programme for 4 hours + separate data logs"]])};},
 sat(){return {
  title:"VSAT satellite link", tag:"Only link off the island",
  body:kv([
   ["Service","Speedcast Ku-band VSAT, guaranteed upload"],
   ["Upload",pr()?"15 Mbps":"10 Mbps"],
   ["Carries","1 programme with mixed audio + drone data + heart rate + emergency comms"],
   ["Programme",pr()?"~10.16 Mbps":"~5.11 Mbps"],
   ["Duration","4 hours live"],
   ["Why not Starlink","not available on Tromelin"]])+`<p class="note">On the mainland the video and the data meet again to build the ${pr()?"AR/3D (or 2D)":"2D"} graphics for PC, TV and smartphone.</p>`};},
 track(){return {
  title:"Race track", tag:"Drone race",
  body:kv([["Lap","~"+(L/1000).toFixed(1)+" km, CP0 start/finish + CP1–CP7"],["Pilots","24, 8 drones in the air per round"],["Rounds","6 × 10 minutes"],["Event","1 day, 4 hours of live coverage"]])};},
 cp(k){const s=CPS[k];return {
  title:k?"Checkpoint CP"+k:"CP0 · Start and finish", tag:"Race track",
  body:kv([["Position on the lap",fmt(s)+" m from the start"],["Detected by","the drone’s GPS position"],["Used for","lap times, positions and ranking"],["Updated",pr()?"5 times per second":"once per second"]])};},
 wx(){return {title:"Existing weather station", tag:"Already on the island",
  body:kv([["Distance to hub","~"+fmt(Math.hypot(427-HUB[0],547-HUB[1]))+" m"],["Data","wind, temperature, humidity, rain"],["Why it matters","wind decides whether the drones can fly"],["In the project","not part of the system, shown for reference"]])};},
 dr(n){return {title:"Drone DR-0"+n, tag:"In flight · simulated data",
  body:`<p>Each pilot brings their own drone, goggles and remote control. Same reference setup for all: GPS drone with Walksnail Avatar video and ELRS remote.</p><div><h3>Live data</h3><div class="tele" id="tele"></div></div>`+kv([
   ["Telemetry","flight controller (MAVLink) → Black Box → control room"],["Position, speed, height",pr()?"5 times per second":"once per second"],["Battery, heart rate","once per second"],["FPV video","drone → pilot’s goggles → HDMI to the mixer"]])};},
 air(){return {title:"Existing airstrip", tag:"Already on the island",body:kv([["Length","~1.2 km"],["Use","brings people and equipment"],["Distance to hub","~130 m"]])};}
};

/* ---------- inspector ---------- */
const INS=$("#inspector");
function card(o,col){
 let h=`<div class="ins-h"><button class="back" id="back">← Overview</button><h2>${esc(o.title)}</h2>${o.tag?`<span class="tag" style="color:${col}">${esc(o.tag)}</span>`:""}</div><div class="ins-b">${o.body}`;
 if(o.ver)h+=`<div class="ver"><b>${pr()?"Premium":"Low-cost"}</b><span>${esc(o.ver)}</span></div>`;
 h+=`</div>`;INS.innerHTML=h;INS.scrollTop=0;$("#back").onclick=()=>{select(null);};}
function show(id){
 if(!id){overview();return;}
 if(id.startsWith("cam"))card(T.cam(CAMS[+id.slice(3)-1]),"var(--cam)");
 else if(id.startsWith("lnk"))card(T.link(CAMS[+id.slice(3)-1]),radio()?"var(--radio)":"var(--fibre)");
 else if(id==="hub")card(T.hub(),"var(--hub)");
 else if(id==="sat")card(T.sat(),"var(--sat)");
 else if(id==="track")card(T.track(),"var(--track)");
 else if(id==="air")card(T.air(),"var(--infra)");
 else if(id==="wx")card(T.wx(),"var(--infra)");
 else if(id.startsWith("cp"))card(T.cp(+id.slice(2)),"var(--track)");
 else if(id.startsWith("dr")){card(T.dr(+id.slice(2)),"var(--drone)");updTele();}
}
function overview(){
 const o=T.overview();const lc=radio()?"var(--radio)":"var(--fibre)";
 INS.innerHTML=`<div class="ins-h"><h2>${o.title}</h2><p class="note" style="margin:0">Tap any point or line on the map to read what it is.</p></div>
 <div class="ins-b">${o.body}

   <div><svg viewBox="0 0 44 18"><path d="M2 9h40" stroke="var(--sat)" stroke-width="2" stroke-dasharray="1.5 4"/></svg><span>VSAT satellite link (not to scale)</span></div>

  <p class="note">Base map: CIA World Factbook. Distances are measured in a straight line from each camera to the hub.</p>
 </div>`;
 INS.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
}

/* ---------- map ---------- */
const svg=$("#map");
const B={x0:120,y0:180,x1:1560,y1:1700};
let vb={x:B.x0,y:B.y0,w:B.x1-B.x0,h:B.y1-B.y0};
const gBase=el("g",{},svg),gTrack=el("g",{},svg),gLinks=el("g",{},svg),gMk=el("g",{},svg);
el("rect",{x:-2000,y:-2000,width:6000,height:6000,fill:"var(--ocean)"},gBase);
const coastD="M"+GEO.coast.map(p=>p.join(" ")).join("L")+"Z";
el("path",{d:coastD,fill:"var(--lagoon)",stroke:"var(--lagoon)","stroke-width":70,"stroke-linejoin":"round"},gBase);
GEO.reef.forEach(l=>el("path",{d:"M"+l.map(p=>p.join(" ")).join("L"),fill:"none",stroke:"var(--reef)","data-sw":2.2,"data-dash":"2 2.5","stroke-linecap":"round"},gBase));
el("path",{d:coastD,fill:"var(--land)",stroke:"var(--land-edge)","data-sw":1.4},gBase);
const lbl=(t,x,y,p,fill,anchor="middle",fs=12,ital)=>{const e=el("text",{x,y,"text-anchor":anchor,"data-fs":fs,"font-family":"Source Sans 3, sans-serif","font-weight":600,fill,"paint-order":"stroke",stroke:"var(--panel)","stroke-linejoin":"round","pointer-events":"none"},p);if(ital)e.setAttribute("font-style","italic");e.textContent=t;return e;};
[["reef",230,330],["reef",1480,1560],["Indian Ocean",1350,420]].forEach(([t,x,y])=>lbl(t,x,y,gBase,"var(--reef)","middle",12,true));
/* airstrip */
const ag=el("g",{class:"lnk","data-id":"air"},gBase);
el("line",{x1:AIR[0][0],y1:AIR[0][1],x2:AIR[1][0],y2:AIR[1][1],stroke:"var(--infra)","stroke-width":30,opacity:.45},ag);
el("line",{x1:AIR[0][0],y1:AIR[0][1],x2:AIR[1][0],y2:AIR[1][1],stroke:"var(--panel)","data-sw":1,"data-dash":"8 6"},ag);
/* track */
const trackD="M"+C.map(p=>p.join(" ")).join("L")+"Z";
const tg=el("g",{class:"lnk","data-id":"track"},gTrack);
el("path",{d:trackD,fill:"none",stroke:"var(--track)","data-sw":4.5,"stroke-linejoin":"round"},tg);
el("path",{d:trackD,fill:"none",stroke:"transparent","data-sw":18},tg);
const scaled=[];
for(let s=300;s<L-100;s+=480){const p=at(s);scaled.push({e:el("path",{d:"M-6 -6 L4 0 L-6 6",fill:"none",stroke:"var(--track)","stroke-width":3,"stroke-linecap":"round","stroke-linejoin":"round","pointer-events":"none"},gTrack),x:p.x,y:p.y,r:p.hd*180/Math.PI});}
const sf=at(0);const sfl=el("g",{"pointer-events":"none"},gTrack);
el("rect",{x:-16,y:-3,width:32,height:6,fill:"var(--ink)"},sfl);for(let i=0;i<4;i++)el("rect",{x:-16+i*8,y:i%2?-3:0,width:8,height:3,fill:"var(--panel)"},sfl);
scaled.push({e:sfl,x:sf.x,y:sf.y,r:sf.hd*180/Math.PI+90});
lbl("Start / finish",sf.x+20,sf.y+60,gTrack,"var(--ink)","start",12.5);

/* links */
const linkEls={};
function drawLinks(){gLinks.innerHTML="";
 CAMS.forEach(c=>{const g=el("g",{class:"lnk","data-id":"lnk"+c.n},gLinks);
  if(radio())el("line",{class:"vis",x1:c.x,y1:c.y,x2:HUB[0],y2:HUB[1],stroke:"var(--radio)","data-sw":2.2,"data-dash":"7 5"},g);
  else el("line",{class:"vis",x1:c.x,y1:c.y,x2:HUB[0],y2:HUB[1],stroke:"var(--fibre)","data-sw":3.2},g);
  el("line",{x1:c.x,y1:c.y,x2:HUB[0],y2:HUB[1],stroke:"transparent","data-sw":16},g);
  const mx=c.x+(HUB[0]-c.x)*.55,my=c.y+(HUB[1]-c.y)*.55;
  lbl(fmt(radio()?c.dHub:c.dHub*1.15)+" m",mx,my,g,radio()?"var(--radio)":"var(--fibre)","middle",11.5);
  linkEls[c.n]=g;});
 const g=el("g",{class:"lnk","data-id":"sat"},gLinks);
 el("line",{class:"vis",x1:HUB[0],y1:HUB[1],x2:1530,y2:250,stroke:"var(--sat)","data-sw":2,"data-dash":"1.5 5","stroke-linecap":"round"},g);
 el("line",{x1:HUB[0],y1:HUB[1],x2:1530,y2:250,stroke:"transparent","data-sw":16},g);
 lbl("→ VSAT satellite (not to scale)",1525,232,g,"var(--sat)","end",12.5);
 applyScale();refreshSel();}

/* markers */
const mks=[];
function marker(id,x,y,kind,label){const g=el("g",{class:"mk","data-id":id,tabindex:0,role:"button","aria-label":label},gMk);
 if(kind==="hub"){el("rect",{x:-17,y:-17,width:34,height:34,rx:8,class:"halo",stroke:"var(--hub)"},g);
  el("path",{d:"M-8 6V-1L0 -8 8 -1V6z",fill:"var(--hub)"},g);}
 else if(kind==="sat"){el("circle",{r:13,class:"halo",stroke:"var(--sat)"},g);el("path",{d:"M-6 4 A8 8 0 0 1 4 -6 M-2 4 A4 4 0 0 1 4 -2",fill:"none",stroke:"var(--sat)","stroke-width":2,"stroke-linecap":"round"},g);el("circle",{cx:-4,cy:4,r:2,fill:"var(--sat)"},g);}
 else{el("circle",{r:13,class:"halo",stroke:"var(--cam)"},g);const t=el("text",{"text-anchor":"middle",y:4.5,"font-family":"JetBrains Mono, monospace","font-weight":600,"font-size":13,fill:"var(--ink)"},g);t.textContent=label.replace("Camera ","");}
 if(kind!=="cam"){const t=el("text",{x:kind==="hub"?24:20,y:5,"font-family":"Source Sans 3, sans-serif","font-weight":700,"font-size":13.5,fill:"var(--ink)","paint-order":"stroke",stroke:"var(--panel)","stroke-width":3.5,"stroke-linejoin":"round"},g);t.textContent=label;}
 mks.push({e:g,x,y});return g;}
CAMS.forEach(c=>marker("cam"+c.n,c.x,c.y,"cam","Camera "+c.n));
marker("hub",HUB[0],HUB[1],"hub","Technical hub");
const satPos=[HUB[0]+70,HUB[1]+55];
/* existing weather station */
(()=>{const g=el("g",{class:"mk","data-id":"wx",tabindex:0,role:"button","aria-label":"Existing weather station"},gMk);
 el("rect",{x:-10,y:-10,width:20,height:20,rx:3,class:"halo",stroke:"var(--infra)"},g);el("path",{d:"M-4 5V-5M-4 -5h8l-3 3 3 3h-8",fill:"none",stroke:"var(--infra)","stroke-width":1.8,"stroke-linejoin":"round"},g);
 const t=el("text",{x:-14,y:-12,"text-anchor":"end","font-family":"Source Sans 3, sans-serif","font-weight":600,"font-size":12,fill:"var(--muted)","paint-order":"stroke",stroke:"var(--panel)","stroke-width":3.5},g);t.textContent="Weather station";
 mks.push({e:g,x:427,y:547});})();
/* checkpoints */
CPS.forEach((s,k)=>{const p=at(s);const g=el("g",{class:"mk","data-id":"cp"+k,tabindex:0,role:"button","aria-label":"Checkpoint CP"+k},gTrack);
 el("rect",{x:-6.5,y:-6.5,width:13,height:13,transform:"rotate(45)",class:"halo",stroke:"var(--track)"},g);
 const t=el("text",{x:-12,y:-10,"text-anchor":"end","font-family":"JetBrains Mono, monospace","font-weight":600,"font-size":11,fill:"var(--ink)","paint-order":"stroke",stroke:"var(--panel)","stroke-width":3},g);t.textContent="CP"+k;
 mks.push({e:g,x:p.x,y:p.y});});
/* drones */
const gDr=el("g",{},svg);
const DRN=Array.from({length:8},(_,i)=>{const g=el("g",{class:"mk drone","data-id":"dr"+(i+1),tabindex:0,role:"button","aria-label":"Drone DR-0"+(i+1)},gDr);
 el("circle",{r:11,class:"halo",stroke:"var(--drone)"},g);
 el("path",{d:"M-4.5 -4.5 4.5 4.5M4.5 -4.5 -4.5 4.5",stroke:"var(--drone)","stroke-width":1.8},g);
 [[-5,-5],[5,-5],[-5,5],[5,5]].forEach(([x,y])=>el("circle",{cx:x,cy:y,r:2.6,fill:"none",stroke:"var(--drone)","stroke-width":1.4},g));
 const t=el("text",{x:15,y:4,"font-family":"JetBrains Mono, monospace","font-weight":600,"font-size":11,fill:"var(--ink)","paint-order":"stroke",stroke:"var(--panel)","stroke-width":3},g);t.textContent="DR-0"+(i+1);
 const d={g,i,v:[32.1,33.4,31.2,32.8,30.9,33.0,31.7,32.4][i],d:-i*380,spd:0,alt:6,bat:100,bpm:100,ph:i*1.9,pub:{d:-i*380,prev:-i*55,t:0,spd:0,alt:6},bio:{bat:100,bpm:100}};
 mks.push({e:g,x:0,y:0,dr:d});return d;});
marker("sat",satPos[0],satPos[1],"sat","VSAT antenna");

/* viewport */
function mpp(){const r=svg.getBoundingClientRect();if(!r.width)return 1;return Math.max(vb.w/r.width,vb.h/r.height);}
function applyScale(){const m=mpp();
 svg.querySelectorAll("[data-sw]").forEach(e=>e.setAttribute("stroke-width",e.dataset.sw*m));
 svg.querySelectorAll("[data-dash]").forEach(e=>e.setAttribute("stroke-dasharray",e.dataset.dash.split(" ").map(v=>v*m).join(" ")));
 svg.querySelectorAll("[data-fs]").forEach(e=>{e.setAttribute("font-size",e.dataset.fs*m);e.setAttribute("stroke-width",3.5*m);});
 mks.forEach(k=>{if(!k.dr)k.e.setAttribute("transform",`translate(${k.x} ${k.y}) scale(${m})`);});
 scaled.forEach(k=>k.e.setAttribute("transform",`translate(${k.x} ${k.y}) rotate(${k.r}) scale(${m})`));
 const nice=[25,50,100,200,250,500,1000];let len=nice[0];for(const n of nice){if(n/m<=150)len=n;}
 $("#sb-bar").style.width=(len/m)+"px";$("#sb-txt").textContent=len+" m";}
function setVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);applyScale();}
function fit(){vb={x:B.x0,y:B.y0,w:B.x1-B.x0,h:B.y1-B.y0};setVB();}
function zoomAt(f,cx,cy){const nw=Math.min(2600,Math.max(200,vb.w*f));const k=nw/vb.w;vb.x=cx-(cx-vb.x)*k;vb.y=cy-(cy-vb.y)*k;vb.w=nw;vb.h*=k;setVB();}
function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
svg.addEventListener("wheel",e=>{e.preventDefault();const p=toSvg(e);zoomAt(e.deltaY>0?1.15:1/1.15,p.x,p.y);},{passive:false});
const ptrs=new Map();let drag=null,pinch=null;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,moved:false,t:e.target};
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w};drag=null;}});
svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const mid=toSvg({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2});zoomAt((pinch.w*pinch.d/d)/vb.w,mid.x,mid.y);return;}
 if(drag){const m=mpp(),dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(drag.moved){vb.x=drag.vx-dx*m;vb.y=drag.vy-dy*m;setVB();}}});
svg.addEventListener("pointerup",e=>{const d=drag;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
 if(d&&!d.moved&&ptrs.size===0){const t=d.t.closest&&d.t.closest("[data-id]");select(t?t.dataset.id:null);}drag=null;});
svg.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);drag=null;pinch=null;});
svg.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset.id){e.preventDefault();select(e.target.dataset.id);}});
$("#z-in").onclick=()=>zoomAt(1/1.4,vb.x+vb.w/2,vb.y+vb.h/2);
$("#z-out").onclick=()=>zoomAt(1.4,vb.x+vb.w/2,vb.y+vb.h/2);
$("#z-fit").onclick=fit;
new ResizeObserver(setVB).observe($("#stage"));

function refreshSel(){const s=S.sel||"";
 mks.forEach(k=>k.e.classList.toggle("sel",k.e.dataset.id===s));
 const n=s.startsWith("cam")||s.startsWith("lnk")?+s.slice(3):0;
 Object.entries(linkEls).forEach(([k,g])=>g.classList.toggle("hl",+k===n));}
function select(id,center){S.sel=id;show(id);refreshSel();
 if(center&&id){let p=null;if(id.startsWith("cam"))p=CAMS[+id.slice(3)-1];else if(id==="hub")p={x:HUB[0],y:HUB[1]};else if(id==="sat")p={x:satPos[0],y:satPos[1]};
  if(p&&vb.w>900){const w=900,k=w/vb.w;vb.w=w;vb.h*=k;vb.x=p.x-vb.w/2;vb.y=p.y-vb.h/2;setVB();}}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")select(null);});

/* switches */
function setLk(v){S.lk=v;try{localStorage.setItem("dq-lk",v);}catch(e){}document.querySelectorAll("[data-lk]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lk===v));drawLinks();show(S.sel);}
const VB=[...document.querySelectorAll("[data-v]")];const paintV=()=>VB.forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.vr));VB.forEach(b=>b.onclick=()=>{setVr(b.dataset.v);paintV();});paintV();
function setVr(v){S.vr=v;drawLinks();acc=1e9;document.getElementById("drate").textContent=pr()?"Drone positions: 5 times per second":"Drone positions: every second";try{localStorage.setItem("dq-vr",v);}catch(e){}document.querySelectorAll("[data-vr]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.vr===v));show(S.sel);}

document.querySelectorAll("[data-vr]").forEach(b=>b.onclick=()=>setVr(b.dataset.vr));

document.querySelectorAll("[data-lk]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lk===S.lk));
document.querySelectorAll("[data-vr]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.vr===S.vr));
/* drone simulation: positions published 1 per second (Low-Cost) or 5 per second (Premium), battery + heart 1 per second */
let simT=180,flying=true,acc=0,accB=0,last=performance.now();
const bendAt=s=>{const a=at(s-30).hd,b=at(s+30).hd;let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.min(1,Math.abs(d)/1.6);};
function sim(dt){simT+=dt;DRN.forEach(d=>{const b=bendAt(d.d);const tgt=d.v*(1-.4*b)*(1+.03*Math.sin(simT*.4+d.ph));d.spd+=(tgt-d.spd)*Math.min(1,dt*2.5);d.d+=d.spd*dt;
 d.alt=5.5+2.2*Math.sin(simT*.6+d.ph)+1.5*(1-b);d.bat=Math.max(20,100-simT/600*72-(d.i%3)*1.5);d.bpm=104+30*b+8*Math.sin(simT*.2+d.ph)+(d.i%4)*3;});}
for(let k=0;k<1800;k++)sim(.1);
const hz=()=>pr()?5:1;
function pubPos(now){DRN.forEach(d=>{d.pub.prev=d.pub.d;d.pub.d=d.d;d.pub.spd=d.spd;d.pub.alt=d.alt;d.pub.t=now;});}
function pubBio(){DRN.forEach(d=>{d.bio.bat=d.bat;d.bio.bpm=d.bpm;});}
pubPos(last);pubBio();
function placeDrones(now){const m=mpp();DRN.forEach(d=>{let s=d.pub.d;if(flying){const f=Math.min(1,(now-d.pub.t)/(1000/hz()));s=d.pub.prev+(d.pub.d-d.pub.prev)*f;}
 const p=at(Math.max(0,s));const k=mks.find(k=>k.dr===d);k.x=p.x;k.y=p.y;d.g.setAttribute("transform",`translate(${p.x} ${p.y}) scale(${m})`);});}
function rank(d){return DRN.filter(o=>o.pub.d>d.pub.d).length+1;}
window.updTele=function(){const t=document.getElementById("tele");if(!t||!S.sel||!S.sel.startsWith("dr"))return;const d=DRN[+S.sel.slice(2)-1];
 const lap=Math.min(6,Math.max(1,Math.floor(d.pub.d/L)+1));
 t.innerHTML=`<div><b>P${rank(d)} / 8</b><span>position · lap ${lap}/6</span></div><div><b>${Math.round(d.pub.spd*3.6)} km/h</b><span>speed · ${hz()}×/s</span></div><div><b>${Math.round(d.pub.alt)} m</b><span>height · ${hz()}×/s</span></div><div><b>${Math.round(d.bio.bat)}%</b><span>battery · 1×/s</span></div><div><b>♥ ${Math.round(d.bio.bpm)} bpm</b><span>pilot heart rate · 1×/s</span></div><div><b>${fmt(((d.pub.d%L)+L)%L)} m</b><span>along the lap</span></div>`;};
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(flying){sim(dt);acc+=dt;accB+=dt;let ch=false;if(acc>=1/hz()){acc%=1/hz();pubPos(now);ch=true;}if(accB>=1){accB%=1;pubBio();ch=true;}if(ch)updTele();}
 placeDrones(now);requestAnimationFrame(tick);}
requestAnimationFrame(tick);
document.getElementById("fly").onclick=function(){flying=!flying;this.setAttribute("aria-pressed",flying);this.querySelector("span").textContent=flying?"Drones flying":"Drones paused";
 document.getElementById("flyic").innerHTML=flying?'<rect x="4" y="3" width="3" height="10"/><rect x="9" y="3" width="3" height="10"/>':'<path d="M4 3l9 5-9 5z"/>';};
drawLinks();fit();overview();
document.getElementById("drate").textContent=pr()?"Drone positions: 5 times per second":"Drone positions: every second";
})();
</script>
