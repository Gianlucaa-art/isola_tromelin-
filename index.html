<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mappa tecnica Tromelin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app a tutta altezza; carta nautica a sinistra, ispettore a destra (sotto su telefono); tre viste a schede */
:root{
  --bg:#e9f0f2; --panel:#ffffff; --ink:#14232b; --muted:#536872; --line:#d0dce1; --chip:#eef4f6;
  --ocean:#cfe5ef; --lagoon:#e4f2f8; --land:#efe5cf; --land-edge:#bfa978; --reef:#2b9fc2; --grid:#9fbccb;
  --track:#d99a00; --accent:#0b6e8a; --accent-ink:#ffffff; --prop:#6b3fa0; --doc:#1f7a45; --warn:#8a5a00; --bad:#a3302a;
  --radio:#b4236b; --fibra:#1d5fd6; --rame:#33434b; --infra:#78878e; --drone:#0f5b74; --sel:#e8513a;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1317; --panel:#111c21; --ink:#e1eaed; --muted:#93a7b0; --line:#25363e; --chip:#18272e;
  --ocean:#0e2833; --lagoon:#133746; --land:#373022; --land-edge:#7a6844; --reef:#4cc3e3; --grid:#2c4c5b;
  --track:#f2c14b; --accent:#5ec3df; --accent-ink:#06171d; --prop:#c9a6f2; --doc:#6fd39a; --warn:#f1c46b; --bad:#f3938c;
  --radio:#f27fb6; --fibra:#86acff; --rame:#b9c6cc; --infra:#8b989e; --drone:#7fd3ec; --sel:#ff8a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1317; --panel:#111c21; --ink:#e1eaed; --muted:#93a7b0; --line:#25363e; --chip:#18272e;
  --ocean:#0e2833; --lagoon:#133746; --land:#373022; --land-edge:#7a6844; --reef:#4cc3e3; --grid:#2c4c5b;
  --track:#f2c14b; --accent:#5ec3df; --accent-ink:#06171d; --prop:#c9a6f2; --doc:#6fd39a; --warn:#f1c46b; --bad:#f3938c;
  --radio:#f27fb6; --fibra:#86acff; --rame:#b9c6cc; --infra:#8b989e; --drone:#7fd3ec; --sel:#ff8a6b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;flex-direction:column;gap:10px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.id{font-family:var(--f-mono);font-size:.82em;font-weight:600}

/* header */
header.app{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px}
.brand{display:grid;gap:2px;min-width:0}
.brand .eb{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:82%;font-weight:800;font-size:1.55rem;line-height:1.05;text-wrap:balance}
nav.tabs{display:flex;gap:2px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:3px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-stretch:90%;font-weight:650;font-size:.92rem;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0002}

/* main */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:10px}
.stage{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ocean)}
.stage svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.view{position:absolute;inset:0}
.inspector{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0;display:flex;flex-direction:column}
@media (max-width:900px){
  body{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .stage{height:62vh;min-height:380px}
  .inspector{overflow:visible}
  nav.tabs{margin-left:0}
}

/* toolbar on map */
.tools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;pointer-events:none;z-index:3}
.tools>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px;box-shadow:0 1px 3px #0002}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:5px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:.85rem;box-shadow:0 1px 3px #0002}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--chip)}
.tbtn svg{width:15px;height:15px}
.zoom{position:absolute;right:10px;bottom:44px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoom button{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.1rem;font-weight:700;box-shadow:0 1px 3px #0002}
.layers{position:absolute;top:48px;left:10px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;box-shadow:0 6px 20px #0003;display:grid;gap:4px;min-width:230px;max-width:calc(100% - 20px)}
.layers h3{margin:0 0 4px;font-family:var(--f-display);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.layers label{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.status{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;padding:6px 10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border-top:1px solid var(--line);font-size:.76rem;color:var(--muted);z-index:3}
.status .mono{font-family:var(--f-mono)}
.scalebar{display:flex;align-items:center;gap:6px;font-family:var(--f-mono)}
.scalebar i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
.stage svg.north{position:absolute;right:12px;top:52px;width:28px;height:36px;z-index:2;pointer-events:none}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:42px;background:var(--ink);color:var(--panel);padding:6px 12px;border-radius:20px;font-size:.82rem;z-index:3;white-space:nowrap}

/* svg classes */
.mk{cursor:pointer}
.mk:focus,.mk:focus-visible{outline:none}
#map .mk .halo{fill:var(--panel);stroke-width:2.2}
#map .mk:hover .halo,#map .mk:focus-visible .halo{stroke-width:3.4}
#map .mk.sel .halo{stroke:var(--sel);stroke-width:3.6}
#map .mk text{font-family:var(--f-mono);font-weight:600;font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
#hubsvg text,#extsvg text{font-family:var(--f-mono);fill:var(--ink)}
#hubsvg .mk:hover .halo,#hubsvg .mk:focus-visible .halo{stroke:var(--accent)}
#hubsvg .mk.sel .halo{stroke:var(--sel);stroke-width:.6;stroke-dasharray:none}
#extsvg .mk:hover .halo,#extsvg .mk:focus-visible .halo{stroke-width:3}
#extsvg .mk.sel .halo{stroke:var(--sel);stroke-width:3.5}
.lbl{font-family:var(--f-mono);fill:var(--muted);paint-order:stroke;stroke:var(--panel);pointer-events:none}
.zone{cursor:pointer}
.zone:hover rect{stroke-width:2.5}
.lnk{cursor:pointer}
.lnk.hl{filter:drop-shadow(0 0 3px var(--sel))}
.pulse{fill:none;stroke:var(--sel);stroke-width:2;animation:pul 1.6s ease-out infinite}
@keyframes pul{from{r:16;opacity:.9}to{r:30;opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.6}}

/* inspector */
.ins-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 14px;z-index:2;display:grid;gap:6px}
.ins-b{padding:12px 14px 18px;display:grid;gap:14px}
.back{justify-self:start;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:.85rem}
.ins-h h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:1.25rem;line-height:1.15;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.c-id{color:var(--ink);background:var(--chip);border-color:var(--line)}
.c-doc{color:var(--doc)} .c-prop{color:var(--prop)} .c-ver{color:var(--warn)} .c-inf{color:var(--infra)} .c-sim{color:var(--drone)} .c-bad{color:var(--bad)}
.ins-b h3{margin:0 0 6px;font-family:var(--f-display);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ins-b p{margin:0}
.kv{display:grid;grid-template-columns:minmax(96px,max-content) 1fr;gap:5px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;font-variant-numeric:tabular-nums}
.dec{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:grid;gap:4px;font-size:.88rem;background:var(--chip)}
.dec b{font-family:var(--f-mono);font-size:.78rem;color:var(--prop)}
.dec .row{display:grid;grid-template-columns:78px 1fr;gap:8px}
.dec .row span:first-child{color:var(--muted)}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.88rem}
ul.chk li{display:grid;grid-template-columns:18px 1fr;gap:6px}
ul.chk li::before{content:"";width:11px;height:11px;margin-top:4px;border:1.5px solid var(--warn);border-radius:2px}
figure{margin:0;display:grid;gap:4px}
figure img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
figcaption{font-size:.78rem;color:var(--muted)}
.list{display:grid;gap:12px}
.grp h3{margin-bottom:4px}
.row-btn{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 6px;border-radius:6px;cursor:pointer}
.row-btn:hover{background:var(--chip)}
.row-btn .nm{font-size:.9rem;min-width:0}
.row-btn .mt{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.sw{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);background:var(--panel)}
.sw.prop{border-style:dashed;border-color:var(--prop)}
.sw.doc{border-color:var(--doc)}
.sw.inf{border-color:var(--infra);border-radius:2px}
.sw.sim{border-color:var(--drone);background:var(--drone)}
.sw.rem{border-color:var(--accent);border-radius:3px}
input#q{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.stat b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.legend{display:grid;gap:6px;font-size:.86rem}
.legend div{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.legend svg{width:44px;height:16px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumbs button{border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;cursor:zoom-in;background:#fff;aspect-ratio:1;max-width:100%}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.tele{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tele div{border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.tele b{display:block;font-family:var(--f-mono);font-size:1.02rem;font-variant-numeric:tabular-nums}
.tele span{font-size:.74rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions button{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:.84rem;font-weight:600}
.lb{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:82vh;border-radius:6px;background:#fff}
.lb figcaption{color:#e8eef0;text-align:center;margin-top:8px;font-size:.9rem}
.lb button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));border:0;background:#fff;color:#111;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.decs{display:grid;gap:10px}
.decs .dec{background:var(--panel)}
.decview{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:16px}
.decgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;max-width:1200px}
.decgrid .dec{background:var(--panel);font-size:.9rem;padding:12px 14px}
.decgrid .dec h4{margin:0;font-family:var(--f-display);font-stretch:88%;font-size:1.02rem}
.decgrid .dec .actions{margin-top:4px}
.note{font-size:.82rem;color:var(--muted)}
</style>

<header class="app">
  <div class="brand">
    <span class="eb">SCMM · Drone race · Tromelin Island · v0.4 · 30/10/2026</span>
    <h1>Radio solution map</h1>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-island" data-view="island" aria-selected="true">Island</button>
    <button role="tab" id="tab-hub" data-view="hub" aria-selected="false">Technical hub</button>
    <button role="tab" id="tab-remote" data-view="remote" aria-selected="false">Off the island</button>
    <button role="tab" id="tab-decisions" data-view="decisions" aria-selected="false">Decisions</button>
  </nav>
</header>

<main>
  <div class="stage" id="stage">
    <div class="tools" id="tools">
      <div class="seg" role="group" aria-label="Scenario">
        <button id="sc-lc" data-sc="lc" aria-pressed="true">Low-cost · IP radio</button>
        <button id="sc-pr" data-sc="premium" aria-pressed="false">Premium · video radio</button>
      </div>
      <button class="tbtn" id="btn-layers" aria-pressed="false" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2 1.5 5.5 8 9l6.5-3.5z"/><path d="m1.5 8.5 6.5 3.5 6.5-3.5"/></svg>Layers</button>
      <button class="tbtn island-only" id="btn-measure" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12 12 2l2 2L4 14z"/><path d="m5 9 1.5 1.5M7 7l1.5 1.5M9 5l1.5 1.5"/></svg>Measure</button>
      <button class="tbtn island-only" id="btn-play" aria-pressed="true"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="3" height="10"/><rect x="9" y="3" width="3" height="10"/></svg><span>Drones flying</span></button>
    </div>
    <div class="layers" id="layers" hidden>
      <h3>Map layers</h3>
      <label><input type="checkbox" id="ly-track" checked> Race track and checkpoints</label>
      <label><input type="checkbox" id="ly-cams" checked> C1 cameras</label>
      <label><input type="checkbox" id="ly-links" checked> Radio links</label>
      <label><input type="checkbox" id="ly-dist" checked> Link distances</label>
      <label><input type="checkbox" id="ly-hub" checked> Technical hub</label>
      <label><input type="checkbox" id="ly-group"> Areas drawn by the group</label>
      <label><input type="checkbox" id="ly-infra" checked> Existing infrastructure</label>
      <label><input type="checkbox" id="ly-grid" checked> 250 m grid</label>
      <h3 style="margin-top:6px">Drones shown (filter)</h3>
      <label><input type="checkbox" id="dr-1" checked> DR-01</label>
      <label><input type="checkbox" id="dr-2" checked> DR-02</label>
      <label><input type="checkbox" id="dr-3" checked> DR-03</label>
      <label><input type="checkbox" id="dr-4" checked> DR-04</label>
    </div>
    <svg class="north island-only" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 3 26 30 17 24 8 30z" fill="var(--ink)"/><text x="17" y="42" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="var(--ink)">N</text></svg>

    <div class="view" id="v-island"><svg id="map" aria-label="Map of Tromelin Island with race track and equipment"></svg></div>
    <div class="view" id="v-hub" hidden><svg id="hubsvg" aria-label="Technical hub layout"></svg></div>
    <div class="view" id="v-remote" hidden><svg id="extsvg" aria-label="Links off the island"></svg></div>
    <div class="decview" id="v-decisions" hidden><div class="decgrid" id="decgrid"></div></div>

    <div class="zoom" id="zoom">
      <button id="z-in" aria-label="Zoom in">+</button>
      <button id="z-out" aria-label="Zoom out">−</button>
      <button id="z-fit" aria-label="Fit" style="font-size:.8rem">⤢</button>
    </div>
    <div class="hint" id="hint" hidden></div>
    <div class="status" id="status">
      <span class="scalebar"><i id="sb-bar" style="width:80px"></i><span id="sb-txt">200 m</span></span>
      <span class="mono" id="coords">E — · S —</span>
      <span id="disclaimer">Preliminary plan, not a topographic survey · symbols enlarged for legibility</span>
    </div>
  </div>

  <aside class="inspector" id="inspector" aria-live="polite"></aside>
</main>

<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const $=s=>document.querySelector(s);
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const fmt=n=>Math.round(n).toLocaleString("en-GB");
const fmtE=n=>n==null?"—":n.toLocaleString("en-GB")+" €";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S={view:"island",sc:"lc",sel:null,measure:false,mpts:[],playing:!matchMedia("(prefers-reduced-motion: reduce)").matches,
  ly:{track:1,cams:1,links:1,dist:1,hub:1,group:0,infra:1,grid:1},drones:[1,1,1,1]};
try{const v=localStorage.getItem("tromelin-sc");if(v==="premium"||v==="lc")S.sc=v;}catch(e){}

/* ---------- geometria ---------- */
const C=GEO.circuit, CUM=GEO.cum, L=GEO.L, HUB=GEO.hub;
function at(s){s=((s%L)+L)%L;let lo=0,hi=CUM.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(CUM[m]<=s)lo=m;else hi=m-1;}
  const a=C[lo],b=C[(lo+1)%C.length],sl=(lo+1<CUM.length?CUM[lo+1]:L)-CUM[lo],t=sl?(s-CUM[lo])/sl:0;
  return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,hd:Math.atan2(b[1]-a[1],b[0]-a[0])};}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const AIR=GEO.air, WXE=[427,547];
const LB=d=>{const km=d/1000,lc=S.sc==="lc",f=lc?5.5:2.3,fspl=20*Math.log10(km)+20*Math.log10(f*1000)+32.44,prx=lc?30+26-fspl:24+3+17-fspl,fr=17.32*Math.sqrt(km/(4*f));return {f,fspl,prx,fr,clear:fr*.6,rain:lc?0.43*km:0.01*km};};
const dec1=n=>n.toFixed(1);

/* ---------- decisions ---------- */
const DEC={
 D01:{t:"Geographic base and scale",dato:"CIA map of the island with a 0–0.4 km scale bar (80 px on the 330×355 image).",scelta:"Vector base traced from the CIA map, units in metres: 1 px = 5 m.",perche:"It is the only verifiable metric reference among the attachments.",limite:"The airstrip measures ~1,115 m vs the official 1,200 m (−7%): preliminary plan, not a survey.",els:["INF-PISTA"]},
 D02:{t:"One technical hub",dato:"Pilots area and Room commentary were drawn ~720 m apart; the control room had no position.",scelta:"Control room, commentators and pilots in one compound at the centre of the island, 130 m from the airstrip, 187 m from the track.",perche:"Short cables for goggles, biometrics and audio; farthest camera at ~730 m instead of ~1,100 m.",limite:"To be approved by the group. Safety distances from the airstrip and flight area to be checked.",els:["HUB","Z-COM","Z-PIL"]},
 D03:{t:"Cameras with unique IDs",dato:"Eight labels all called “C1” on board 2.",scelta:"C1-01…C1-08 numbered from the start in race direction, ~35 m from the track towards the coast.",perche:"Every position can be traced on the map, block diagram and spreadsheet.",limite:"Exact shooting spots to be chosen on site.",els:["C1-01","C1-02","C1-03","C1-04","C1-05","C1-06","C1-07","C1-08"]},
 D04:{t:"Virtual GPS checkpoints",dato:"The course requires real-time position and filters; the group defined no checkpoints.",scelta:"CP0 start/finish + CP1…CP7 in front of each camera, detected by the on-board GPS (geofence).",perche:"Split times and ranking with no extra hardware; every pass is framed by a camera.",limite:"M10 GPS accuracy is a few metres: official timing needs RTK (premium).",els:["CP0","CP1","CP2","CP3","CP4","CP5","CP6","CP7"]},
 D05:{t:"Cameras linked by radio (low-cost: IP radio)",dato:"Camera–hub distances 264–727 m; copper Ethernet reaches 100 m; the Teradek Spark 4K in the budget reaches ~150 m.",scelta:"An IP radio on each camera (RL-01…08) pointing at a base station on mast MST-01.",perche:"The island is flat (max ~6 m, shrubs 0.5–1 m): 4–6 m masts give line of sight. Estimated signal −48.5 dBm on the longest link, rain −0.3 dB.",limite:"Channels must be kept apart from the drones’ 5.8 GHz video; outdoor power limits and permits to be checked.",els:["MST-01","L-C1-05","C1-05"]},
 D06:{t:"Premium: dedicated video transmitters",dato:"The group pointed to Vislink transmitters as the radio solution.",scelta:"A Vislink HCAM video transmitter on each camera (VTX-01…08); 4 Quantum receivers (VRX) in the control room, 2 streams each.",perche:"One-frame latency (manufacturer figure), SDI input, bands away from the drones (e.g. 2 GHz).",limite:"Cost: a used HCAM sells for £9,800–11,760; licensed bands; up to 35 W per transmitter.",els:["MST-01","VRX","L-C1-05"]},
 D14:{t:"Why not fibre and not Starlink on every camera",dato:"The group had three options: Starlink per camera, radio, fibre.",scelta:"Radio is chosen.",perche:"Fibre: ~$22–29k of tactical cable alone and 4–5 km to lay in a nesting area, with no benefit for viewers. Starlink per camera: 3 satellite hops, 9 terminals, more sensitive to rain.",limite:"Fibre would win for a multi-day event or if outdoor radio were not authorised.",els:["L-C1-05"]},
 D07:{t:"Exit to the audience: one Starlink",dato:"12 video sources on the island; one satellite uplink.",scelta:"Not part of the radio network: it is the mandatory exit from the island. The control room cuts 1 programme at 1080p50 ~8 Mbps and sends it through SAT-01 (premium: SAT-02 as backup).",perche:"Uncompressed video is 829 Mbps; 12 compressed streams would be ~100 Mbps.",limite:"Starlink coverage and upload at Tromelin to be checked.",els:["SAT-01","X-LEO"]},
 D08:{t:"Data-only backup and 2D map",dato:"Iridium GO! exec: 22 kbps transmit.",scelta:"Only positions, biometrics, weather and text go over Iridium; viewers see the 2D map.",perche:"At 22 kbps video would drop to ~0.66 fps (method from the lectures).",limite:"No video during the backup.",els:["SAT-BK","X-MAP"]},
 D09:{t:"Drones: three separate channels",dato:"DJI Goggles 2 have no HDMI output; the M10 GPS has no transmitter of its own.",scelta:"Piloting (remote control) and FPV video stay local; FRX ground receivers with video output feed the control room; telemetry via the remote control link or LoRa to TLM-01.",perche:"Flight control never depends on the satellite.",limite:"An FPV system with video output still has to be chosen.",els:["DR-01","FRX","TLM-01"]},
 D10:{t:"Biometrics in the pilots area",dato:"Only one wristband in the budget; pilots stay seated.",scelta:"4 Bluetooth sensors → Black Box BB-01 in the pilots area → network cable.",perche:"Bluetooth covers a few metres, which is enough. The Tracker is not needed for B1.",limite:"Real-time access to WHOOP data to be checked.",els:["BB-01","PIL"]},
 D11:{t:"Own weather station",dato:"The course requires weather data; the Météo-France station exists but may not be accessible.",scelta:"WX-01 on the technical hub mast.",perche:"Wind decides whether drones can fly.",limite:"Sensor height and position to be refined.",els:["MST-01","INF-WX"]},
 D12:{t:"Independent power",dato:"No power grid documented.",scelta:"Generator PWR-01 ~35 m from the tents + UPS; battery or solar panel at each camera.",perche:"Starlink 110–150 W, PCs, radios and cameras draw power continuously.",limite:"Sizing needs the event duration.",els:["PWR-01"]},
 D13:{t:"AR graphics in the control room, distribution from the cloud",dato:"The group plans AR/3D and a 2D fallback without a location.",scelta:"AR-01 on the island, next to the mixer; cloud for CDN, VOD, data API, 2D map and social feed.",perche:"Graphics must be overlaid on full-quality video, which only exists in the control room.",limite:"Workstation and power on the island.",els:["AR-01","X-SRV"]}
};

/* ---------- elementi ---------- */
const E={}; const add=o=>{E[o.id]=o;return o;};
const cost=(lc,pr)=>()=>S.sc==="lc"?lc:pr;
const CAMDESC={"C1-01":"north-west corner, covers start and finish","C1-02":"west side, first stretch after the start","C1-03":"middle of the south-west side, long straight","C1-04":"south corner, hairpin bend","C1-05":"south-east side","C1-06":"east corner, entry to the return straight","C1-07":"middle of the north-east side","C1-08":"north side, last bend before the finish"};
const camOrder=["C1-01","C1-02","C1-03","C1-04","C1-05","C1-06","C1-07","C1-08"];
const cpOfCam={"C1-01":"CP0","C1-02":"CP1","C1-03":"CP2","C1-04":"CP3","C1-05":"CP4","C1-06":"CP5","C1-07":"CP6","C1-08":"CP7"};
camOrder.forEach(id=>{const c=GEO.cams[id];
 add({id,kind:"cam",layer:"cams",x:c.x,y:c.y,name:"Fixed camera "+id.slice(3),origin:"gruppo",grp:"Cameras",
  img:"cam_"+id,imgCap:"Group board 2: the circled “C1” label corresponds to "+id+".",
  sum:()=>"Position documented by the group ("+CAMDESC[id]+"), moved to the edge of the track. It films "+(cpOfCam[id]==="CP0"?"the CP0 finish line":"checkpoint "+cpOfCam[id])+".",
  kv:()=>[["Position","E "+fmt(c.x)+" m · S "+fmt(c.y)+" m"],["On the lap",(cpOfCam[id]==="CP0"?"finish line, "+fmt(L-c.lap)+" m before the line":fmt(c.lap)+" m from the start")],["To the technical hub",fmt(c.dHub)+" m straight line"],
   ["Link",S.sc==="lc"?"IP radio RL-"+id.slice(3)+" → base station RL-BS on mast MST-01":"Video transmitter VTX-"+id.slice(3)+" (Vislink HCAM) → VRX receivers on mast MST-01"],
   ["Estimated signal",(()=>{const b=LB(c.dHub);return dec1(b.prx)+" dBm at "+dec1(b.f)+" GHz: strong";})()],
   ["Antenna on the mast",(()=>{const b=LB(c.dHub);return "at least "+dec1(b.clear+1)+" m above shrubs (0.5–1 m) and people";})()],
   ["Model",S.sc==="lc"?"Blackmagic Studio Camera 4K Pro G2 (group’s choice)":"Sony FX6 / RED Komodo-X (group’s choice)"],
   ["Minimum requirements",S.sc==="lc"?"1080p50, zoom, IP output (SRT/NDI) to the radio, outdoor housing, 12 V":"1080p50, zoom, SDI output to the transmitter, outdoor housing, 12 V"],
   ["Cost",S.sc==="lc"?"€1,650 each (group); verified list price $2,135, body only":"€7,500 each (group)"],
   ["Power",S.sc==="lc"?"Battery + solar panel: camera 26–46 W + radio of a few W":"Battery + solar panel: camera + transmitter up to 35 W"]],
  dec:["D03",S.sc==="lc"?"D05":"D06","D12"],ver:["Lens and outdoor housing not in the budget","The budget has 1 camera: 8 are needed","Clear line of sight to mast MST-01 (site survey)"],src:"Board 2 (island), possibili_soluzioni_.pdf, budget.pdf pp. 2–3"});
});
const cpNames=["Start / finish","CP1","CP2","CP3","CP4","CP5","CP6","CP7"];
camOrder.forEach((cid,i)=>{const c=GEO.cams[cid];const lap=i===0?0:c.lap;const p=i===0?at(0):{x:c.cp[0],y:c.cp[1]};
 add({id:"CP"+i,kind:"cp",layer:"track",x:p.x,y:p.y,lap,name:i===0?"CP0 · Start and finish":"Checkpoint CP"+i,origin:i===0?"gruppo":"proposta",grp:"Race track",
  img:i===0?"start":null,imgCap:"Group board 1: the “Start” mark.",
  sum:()=>i===0?"Start and finish line documented by the group (“Start” mark on board 1). The race direction follows the arrows: south-west side, south corner, back along the north-east side.":"Proposed virtual gate: the on-board GPS logs the pass when the drone enters a 25 m circle around the point.",
  kv:()=>[["Distance from the start",fmt(lap)+" m ("+(lap/L*100).toFixed(0)+"% of the lap)"],["Filmed by",cid],["Detection",S.sc==="lc"?"M10 GPS (accuracy of a few metres)":"RTK GPS (centimetre accuracy)"],["Ground hardware","None"],["Lap length",fmt(L)+" m (estimated from the board, ±15%)"]],
